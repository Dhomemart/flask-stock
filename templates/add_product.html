<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>เพิ่มสินค้าใหม่</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h3>➕ เพิ่มสินค้าใหม่</h3>
    <form method="POST">
        <div class="mb-3">
            <label>รหัสสินค้า</label>
            <input type="text" name="ProductCode" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>ชื่อสินค้า</label>
            <input type="text" name="Name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>ราคา</label>
            <input type="number" step="0.01" name="Price1" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>หน่วย</label>
            <input type="text" name="SUnit" class="form-control">
        </div>
        <button type="submit" class="btn btn-success">💾 บันทึก</button>
        <a href="/products" class="btn btn-secondary">กลับ</a>
    </form>
</div>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8"> <!-- 🔴 รองรับภาษาไทย -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 🔴 Responsive -->
    <title>รายการสินค้า</title> <!-- 🔴 ชื่อหน้า -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">📦 รายการสินค้า</h2>
    <a href="/add-product" class="btn btn-primary mb-3">➕ เพิ่มสินค้าใหม่</a>
    <input type="text" id="searchInput" class="form-control mb-3" placeholder="🔍 ค้นหา">
    <table class="table table-bordered table-striped table-hover" id="productTable">
        <thead class="table-dark">
            <tr><th>PN</th><th>รหัสสินค้า</th><th>ชื่อ</th><th>ราคา</th><th>หน่วย</th></tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr>
                <td>{{ row.PN }}</td>
                <td>{{ row.ProductCode }}</td>
                <td>{{ row.Name }}</td>
                <td>{{ '{:,.2f}'.format(row.Price1) }}</td>
                <td>{{ row.SUnit }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<script>
const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("keyup", function () {
    const filter = searchInput.value.toLowerCase();
    const rows = document.querySelectorAll("#productTable tbody tr");
    rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(filter) ? "" : "none";
    });
});
</script>
</body>
</html>
